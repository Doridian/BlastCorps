name: Build

# The port for Linux (x86-64, arm64), Windows (x86-64), macOS (arm64) and the
# WebAssembly page, on every push and pull request.  Everything is built from
# the repository alone (port/snapshot/us.v11, docs/PORT.md "The snapshot"):
# no ROM is needed, and none is in any artifact; the player gives the port
# their own at run time.  A push to main also deploys the page to GitHub
# Pages; a tag v* publishes every build on the tag's release.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: us.v11
  EMSDK_VERSION: 6.0.10

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            appimage_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm cmake ninja-build pkg-config libsdl2-dev libepoxy-dev file

      - name: Build
        run: python3 port/build.py --release

      - name: Package (AppImage)
        timeout-minutes: 10
        run: |
          out=blastcorps-linux-${{ matrix.arch }}.AppImage
          curl -sSLfo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage
          chmod +x linuxdeploy
          doc=AppDir/usr/share/doc/blastcorps
          mkdir -p $doc
          cp LICENSE NOTICES.md $doc/
          cp port/fonts/OFL.txt $doc/StardosStencil-OFL.txt
          cp port/third_party/gzip-1.2.4/COPYING $doc/gzip-COPYING
          cp port/res/icon.png blastcorps.png
          # SDL2 and libepoxy (and what they link) go in; libGL and the
          # system's base libraries stay the host's (linuxdeploy's excludelist)
          LDAI_OUTPUT=$out ./linuxdeploy --appdir AppDir -e build/port-$VERSION-release/blastcorps \
              -d port/res/blastcorps.desktop -i blastcorps.png --output appimage
          # (it starts: the libraries are all there)
          { ./$out --help 2>&1 || true; } | grep "usage:"

      - uses: actions/upload-artifact@v4
        with:
          name: blastcorps-linux-${{ matrix.arch }}
          path: blastcorps-linux-${{ matrix.arch }}.AppImage

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm-tools
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-SDL2
            mingw-w64-clang-x86_64-libepoxy
            zip

      - name: Build
        run: python3 port/build.py --release

      - name: Package
        timeout-minutes: 10
        run: |
          # one file: SDL2 and libepoxy are linked in (PORT_STATIC)
          cp build/port-$VERSION-release/blastcorps.exe blastcorps-windows-x86_64.exe
          if ldd blastcorps-windows-x86_64.exe | grep -i /clang64/; then exit 1; fi
          # (it starts)
          { ./blastcorps-windows-x86_64.exe --help 2>&1 || true; } | grep "usage:"
          # every package's licenses, for the release (the AppImage and the
          # macOS app carry theirs inside)
          d=blastcorps-licenses
          mkdir -p $d
          cp LICENSE NOTICES.md $d/
          cp port/fonts/OFL.txt $d/StardosStencil-OFL.txt
          cp port/third_party/gzip-1.2.4/COPYING $d/gzip-COPYING
          for p in SDL2 libepoxy libwinpthread winpthreads; do
              cp -r /clang64/share/licenses/$p $d/$p 2>/dev/null || true
          done
          zip -r $d.zip $d

      - uses: actions/upload-artifact@v4
        with:
          name: blastcorps-windows-x86_64
          path: blastcorps-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: blastcorps-licenses
          path: blastcorps-licenses.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install libepoxy pkgconf ninja dylibbundler

      # SDL2 itself, linked in: Homebrew's sdl2 is sdl2-compat, which loads
      # SDL3 at run time (a library dylibbundler can't see)
      - name: SDL2
        run: |
          curl -sSLf https://github.com/libsdl-org/SDL/releases/download/release-$SDL2_VERSION/SDL2-$SDL2_VERSION.tar.gz | tar xz
          cmake -S SDL2-$SDL2_VERSION -B sdl2-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
              -DCMAKE_INSTALL_PREFIX=$PWD/sdl2
          cmake --build sdl2-build
          cmake --install sdl2-build
          echo "PKG_CONFIG_PATH=$PWD/sdl2/lib/pkgconfig" >> $GITHUB_ENV
        env:
          SDL2_VERSION: 2.32.10

      - name: Build
        run: python3 port/build.py --release --cmake=-DPORT_STATIC=ON

      - name: Package (app in a dmg)
        timeout-minutes: 10
        run: |
          app="dmg/Blast Corps.app"
          c="$app/Contents"
          mkdir -p "$c/MacOS" "$c/Resources/licenses" "$c/Frameworks"
          cp build/port-$VERSION-release/blastcorps "$c/MacOS/"
          v=0.0.0
          case "$GITHUB_REF" in refs/tags/v*) v=${GITHUB_REF_NAME#v} ;; esac
          sed "s/@VERSION@/$v/" port/res/Info.plist > "$c/Info.plist"
          # the icon, from port/res/icon.png
          mkdir blastcorps.iconset
          for n in 16 32 128 256 512; do
              sips -z $n $n port/res/icon.png --out blastcorps.iconset/icon_${n}x${n}.png > /dev/null
              if [ $n -le 256 ]; then
                  sips -z $((n * 2)) $((n * 2)) port/res/icon.png --out blastcorps.iconset/icon_${n}x${n}@2x.png > /dev/null
              fi
          done
          iconutil -c icns blastcorps.iconset -o "$c/Resources/blastcorps.icns"
          cp LICENSE NOTICES.md "$c/Resources/licenses/"
          cp port/fonts/OFL.txt "$c/Resources/licenses/StardosStencil-OFL.txt"
          cp port/third_party/gzip-1.2.4/COPYING "$c/Resources/licenses/gzip-COPYING"
          # libepoxy from Homebrew, in the bundle
          dylibbundler -od -b -x "$c/MacOS/blastcorps" -d "$c/Frameworks" -p @executable_path/../Frameworks/ < /dev/null
          otool -L "$c/MacOS/blastcorps"
          codesign --force --deep -s - "$app"
          # (it starts: the libraries are all there)
          { "$c/MacOS/blastcorps" --help 2>&1 || true; } | grep "usage:"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Blast Corps" -srcfolder dmg -ov -format UDZO blastcorps-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: blastcorps-macos-arm64
          path: blastcorps-macos-arm64.dmg

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Build the WebAssembly page
        run: python3 port/build.py --wasm

      - name: Assemble the site
        run: |
          mkdir _site
          cp build/web-$VERSION/blastcorps.{html,js,wasm} _site/
          cp build/web-$VERSION/blastcorps.html _site/index.html
          d=blastcorps-web
          mkdir -p $d/licenses
          cp _site/* $d/
          cp LICENSE NOTICES.md $d/
          cp port/fonts/OFL.txt $d/licenses/StardosStencil-OFL.txt
          cp port/third_party/gzip-1.2.4/COPYING $d/licenses/gzip-COPYING
          zip -r $d.zip $d

      - uses: actions/upload-artifact@v4
        with:
          name: blastcorps-web
          path: blastcorps-web.zip

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
