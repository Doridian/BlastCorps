    - [0x28BF0, .rodata, hd_front_end/11530]
    - [0x291C0, .rodata, hd_front_end/17990]
    - [0x29290, .rodata, hd_front_end/196F0]
    - [0x292E0, .rodata, hd_front_end/1AE80]
    # RSP microcode data (DMEM image) for the microcode at the end of .text
    - [0x29300, bin, hd_front_end/29690]
  - [0x29B00] # EOF

