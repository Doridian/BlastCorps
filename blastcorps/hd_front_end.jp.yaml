options:
  base_path: .
  basename: hd_front_end.jp
  compiler: IDO
  create_detected_syms: yes
  find_file_boundaries: yes
  target_path: hd_front_end.jp.bin
  symbol_addrs_path: symbol_addrs.hd_front_end.jp.txt
  undefined_funcs_auto_path: undefined_funcs_auto.hd_front_end.jp.txt
  undefined_syms_auto_path: undefined_syms_auto.hd_front_end.jp.txt
  src_path: src
segments:
  # hd_front_end_text is inflated to 0x801E7000 by func_8028B3E0 in hd_code
  - name:  hd_front_end
    type:  code
    vram:  0x801E7000
    start: 0x00000000
    subalign: 4
    subsegments:
    - [0x00000, c, hd_front_end/00000]
    - [0x1C40, c, hd_front_end/1C40]
    - [0x6870, c, hd_front_end/6790]
    - [0x7200, c, hd_front_end/7390]
    - [0x7670, c, hd_front_end/7800]
    - [0x8230, c, hd_front_end/8380]
    - [0x9420, c, hd_front_end/9570]
    - [0xC300, c, hd_front_end/C450]
    - [0xDD20, c, hd_front_end/DE70]
    - [0xE660, c, hd_front_end/E7B0]
    - [0x10700, c, hd_front_end/10850]
    - [0x113E0, c, hd_front_end/11530]
    - [0x178E0, c, hd_front_end/17990]
    - [0x19640, c, hd_front_end/196F0]
    - [0x1A190, c, hd_front_end/1A240]
