    # RSP microcode (0xFB0 bytes, fits IMEM): sets sp=0x110 and loads from
    # DMEM 0xFC4, so it is not r4300 code
    - [0x1FFE0, bin, hd_front_end/20090]
    - [0x20F90, linker, data]
    # .data, then .rodata, of each object in link order (see split_data in tools/gen_code_yaml.py)
    - [0x20F90, .data, hd_front_end/00000]
    - [0x21110, .data, hd_front_end/1C40]
    - [0x21480, .data, hd_front_end/6790]
