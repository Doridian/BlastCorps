options:
  base_path: .
  basename: hd_front_end.eu
  compiler: IDO
  create_detected_syms: yes
  find_file_boundaries: yes
  target_path: hd_front_end.eu.bin
  symbol_addrs_path: symbol_addrs.hd_front_end.eu.txt
  undefined_funcs_auto_path: undefined_funcs_auto.hd_front_end.eu.txt
  undefined_syms_auto_path: undefined_syms_auto.hd_front_end.eu.txt
  src_path: src
segments:
  # hd_front_end_text is inflated to 0x801E7000 by func_8028B3E0 in hd_code
  - name:  hd_front_end
    type:  code
    vram:  0x801E7000
    start: 0x00000000
    subalign: 4
    subsegments:
    - [0x0000, c, hd_front_end/C450]
    - [0x1A20, c, hd_front_end/9570]
    - [0x04900, asm, hd_front_end/00000]
    - [0x65D0, asm, hd_front_end/1C40]
    - [0xB370, asm, hd_front_end/6790]
    - [0xC070, c, hd_front_end/7390]
    - [0xC4E0, asm, hd_front_end/7800]
    - [0xD090, c, hd_front_end/8380]
    - [0xE3A0, c, hd_front_end/DE70]
    - [0xECE0, asm, hd_front_end/E7B0]
    - [0x10FB0, c, hd_front_end/10850]
    - [0x11D10, c, hd_front_end/17990]
    - [0x13B80, c, hd_front_end/196F0]
    - [0x146D0, c, hd_front_end/1A240]
    - [0x15320, c, hd_front_end/1AE80]
    - [0x155A0, asm, hd_front_end/11530]
    - [0x1BA50, asm, hd_front_end/1B100] # handwritten
    - [0x1C080, c, hd_front_end/1B730]
    - [0x1C1D0, c, hd_front_end/1B880]
    - [0x1C240, c, hd_front_end/1B8F0]
    - [0x1D610, c, hd_front_end/1CCC0]
    - [0x1DC20, c, hd_front_end/1D2D0]
    - [0x1DD60, c, hd_front_end/1D410]
    - [0x1DEA0, c, hd_front_end/1D550]
    - [0x1E060, c, hd_front_end/1D710]
    - [0x1E560, c, hd_front_end/1DC10]
    - [0x1ED40, c, hd_front_end/1E3F0]
    - [0x1FF10, c, hd_front_end/1F5C0]
    - [0x202C0, c, hd_front_end/1F970]
    - [0x20670, c, hd_front_end/1FD20]
    # RSP microcode (0xFB0 bytes, fits IMEM): sets sp=0x110 and loads from
    # DMEM 0xFC4, so it is not r4300 code
    - [0x209E0, bin, hd_front_end/20090]
    - [0x21990, linker, data]
    - [0x21990, .data, hd_front_end/C450]
    - [0x21B40, .data, hd_front_end/9570]
    # .data, then .rodata, of each object in link order (see split_data in tools/gen_code_yaml.py)
    - [0x25380, data, hd_front_end/00000]
    - [0x25500, data, hd_front_end/1C40]
    - [0x25910, data, hd_front_end/6790]
    - [0x25930, data, hd_front_end/7800]
    - [0x25970, data, hd_front_end/E7B0]
    - [0x25B10, data, hd_front_end/25070]
    - [0x279E0, .data, hd_front_end/10850]
    - [0x279F0, .data, hd_front_end/1A240]
    - [0x27A40, data, hd_front_end/11530]
    - [0x287F0, .rodata, hd_front_end/C450]
    - [0x28810, .rodata, hd_front_end/9570]
    - [0x288E0, rodata, hd_front_end/00000]
    - [0x289B0, rodata, hd_front_end/1C40]
    - [0x29AD0, rodata, hd_front_end/6790]
    - [0x29B60, rodata, hd_front_end/7800]
    - [0x29DE0, .rodata, hd_front_end/8380]
    - [0x29DF0, rodata, hd_front_end/E7B0]
    - [0x2A210, rodata, hd_front_end/28480]
    - [0x2B7B0, .rodata, hd_front_end/10850]
    - [0x2B810, .rodata, hd_front_end/17990]
    - [0x2B900, .rodata, hd_front_end/196F0]
    - [0x2B950, .rodata, hd_front_end/1A240] # only eu has this block
    - [0x2B9B0, .rodata, hd_front_end/1AE80]
    - [0x2B9D0, rodata, hd_front_end/11530]
    # RSP microcode data (DMEM image) for the microcode at the end of .text
    - [0x2C2B0, bin, hd_front_end/29690]
  - [0x2CAB0] # EOF

# .bss of each object in link order (see split_bss in tools/gen_code_yaml.py),
# by vram.  splat doesn't read this; tools/split.py writes the asm objects'
# .bss and adds it to the linker script.
bss:
  - [0x80213AB0, .bss, hd_front_end/C450]
  - [0x802146E0, .bss, hd_front_end/9570]
  - [0x80216380, bss, hd_front_end/00000]
  - [0x8021A930, bss, hd_front_end/1C40]
  - [0x8021AE50, bss, hd_front_end/6790]
