<!doctype html>
<!--
  The WebAssembly port's page (emcc --shell-file; docs/PORT.md, "WebAssembly").
  The ROM is the player's own: picked once, it is kept in IndexedDB with the
  save (IDBFS at /save), and main() runs once it is there.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blast Corps</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #111; --fg: #ddd; --dim: #888; --accent: #e8b030; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; }
  #stage { flex: 1; width: 100%; min-height: 0; position: relative; background: #000; }
  /* the canvas fills the stage: SDL makes its pixels the stage's (in the
     display's pixels), and the picture takes the stage's shape (the port's
     --aspect window), letterboxed where that is narrower than 4:3 */
  canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block;
           background: #000; outline: none; }
  #panel { padding: 0.6em 16px; text-align: center; }
  #panel label { margin: 0 0.6em; white-space: nowrap; }
  button, .file { background: var(--accent); color: #111; border: 0; border-radius: 4px;
                  padding: 0.4em 1em; font: inherit; cursor: pointer; }
  .file input { display: none; }
  #status { color: var(--dim); margin-top: 0.3em; min-height: 1.4em; }
  #keys { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="panel">
  <div id="start">
    <label class="file">Choose ROM (.z64/.v64/.n64)<input type="file" id="rom" accept=".z64,.v64,.n64,.rom,.bin"></label>
    <button id="play" hidden>Play</button>
    <label><input type="checkbox" id="interp"> 60 fps (--interpolate)</label>
    <label><input type="checkbox" id="hdtext"> high-res text (--hd-text)</label>
  </div>
  <div id="status">Loading...</div>
  <button id="full" hidden>Full screen</button>
  <div id="keys">Arrows/WASD stick, X = A, C = B, Z = Z, Enter = Start, Q/E = L/R, IJKL = C buttons, TFGH = D-pad; a gamepad works too.</div>
</div>
<script>
  var statusEl = document.getElementById('status');
  function status(s) { statusEl.textContent = s; }
  var ROM = '/save/rom.z64', SAVE = '/save/blastcorps.eep';
  var ready = false, started = false, syncTimer = 0;
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (s) { console.log(s); },
    printErr: function (s) { console.warn(s); if (/^fatal/.test(s)) status(s); },
    setStatus: function (s) { if (!started && s) status(s); },
    /* the environment from the address too (read at startup) */
    preRun: [function () {
      var e = new URLSearchParams(location.search).get('env');
      if (e) e.split(',').forEach(function (kv) {
        var i = kv.indexOf('=');
        if (i > 0) Module.ENV[kv.slice(0, i)] = kv.slice(i + 1);
      });
    }],
    onRuntimeInitialized: function () {
      FS.mkdir('/save');
      FS.mount(IDBFS, {}, '/save');
      FS.syncfs(true, function (err) {
        if (err) console.warn('IndexedDB:', err);
        ready = true;
        /* ?rom=URL: the ROM from there (your own copy, on your own server) */
        var url = new URLSearchParams(location.search).get('rom');
        if (url) {
          status('Fetching ' + url + '...');
          fetch(url).then(function (r) {
            if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
            return r.arrayBuffer();
          }).then(function (buf) {
            FS.writeFile(ROM, new Uint8Array(buf));
            FS.syncfs(false, function () { haveRom(); });
          }).catch(function (e) { status('Fetching ' + url + ': ' + e.message); });
          return;
        }
        haveRom();
      });
    },
    /* the game wrote its EEPROM (port/host/video.c): to IndexedDB, once the burst is over */
    syncSave: function () {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(function () {
        FS.syncfs(false, function (err) { if (err) console.warn('saving:', err); });
      }, 500);
    },
  };
  function haveRom() {
    var have = false;
    try { have = FS.stat(ROM).size > 0; } catch (e) {}
    document.getElementById('play').hidden = !have;
    status(have ? 'The ROM is ready.' : 'Choose your Blast Corps ROM (it stays in this browser).');
  }
  function start() {
    if (started || !ready) return;
    started = true;
    document.getElementById('start').hidden = true;
    var args = ['--save', SAVE];
    if (document.getElementById('interp').checked) args.push('--interpolate');
    if (document.getElementById('hdtext').checked) args.push('--hd-text');
    /* more from the address: ?args=--aspect%20window&env=PORT_AUTOSTART=1 */
    var q = new URLSearchParams(location.search);
    if (q.get('args')) args = args.concat(q.get('args').split(' ').filter(Boolean));
    /* the picture follows the page's shape (the port's default with a
       window, --aspect window); its internal resolution is as many times
       240 lines as the canvas has display pixels, but not more than about
       1.3 million pixels (each drawn twice with --interpolate): a high-DPI
       laptop's integrated GPU otherwise draws 4 million, and the browser
       scales the picture up as well as the GPU would.  The port lowers it
       further if the GPU can't keep up (PORT_ADAPT). */
    if (args.indexOf('--scale') < 0 && args.indexOf('--max-pixels') < 0)
      args.push('--max-pixels', '1300000');
    /* --display-hz auto: the display's rate, as the animation frames have it
       (measured before starting: SDL can't tell in a browser) */
    var dh = args.indexOf('--display-hz');
    if (dh >= 0 && args[dh + 1] === 'auto' && displayHz) args[dh + 1] = String(displayHz);
    args.push(ROM);
    status('Running. Click the picture for the keyboard.');
    /* (the panel as it stays, before SDL reads the canvas's size) */
    document.getElementById('full').hidden = !document.fullscreenEnabled;
    Module.canvas.focus();
    Module.callMain(args);
    dispatchEvent(new Event('resize'));
  }
  document.getElementById('play').onclick = start;
  /* the display's rate: the median of 60 animation frames' spacing */
  var displayHz = 0;
  (function () {
    var t = [], last = 0;
    function f(ts) {
      if (last) t.push(ts - last);
      last = ts;
      if (t.length < 60) { requestAnimationFrame(f); return; }
      t.sort(function (a, b) { return a - b; });
      displayHz = Math.round(1000 / t[30]);
    }
    requestAnimationFrame(f);
  })();
  document.getElementById('rom').onchange = function (e) {
    var f = e.target.files[0];
    if (!f || !ready) return;
    status('Reading ' + f.name + '...');
    f.arrayBuffer().then(function (buf) {
      FS.writeFile(ROM, new Uint8Array(buf));
      FS.syncfs(false, function () { start(); });
    });
  };
  Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });
  /* the browser may start the sound suspended, or suspend it later: any
     input is a chance to resume it */
  function resumeAudio() {
    var ac = Module.SDL2 && Module.SDL2.audioContext;
    if (ac && ac.state !== 'running' && ac.state !== 'closed') ac.resume();
  }
  ['keydown', 'pointerdown', 'touchstart'].forEach(function (e) { addEventListener(e, resumeAudio, true); });
  /* SDL takes the canvas's size from its CSS size on the window's resize
     events only: the stage also changes when the panel does (a status line
     that wraps) and in and out of full screen, so any change of it is
     passed on as one */
  if (window.ResizeObserver)
    new ResizeObserver(function () {
      if (started) dispatchEvent(new Event('resize'));
    }).observe(document.getElementById('stage'));
  /* full screen: the stage (the canvas fills it, in the screen's shape) */
  document.getElementById('full').onclick = function () {
    document.getElementById('stage').requestFullscreen().then(function () {
      Module.canvas.focus();
    }).catch(function (e) { status('Full screen: ' + e.message); });
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
